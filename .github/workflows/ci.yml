name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # 零依赖：只装 Node，不跑 npm ci、不装任何包、不建缓存。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 市场索引契约测试（node:test，零依赖）
        run: node --test "tests/*.test.mjs"
      - name: 市场索引安装源可达性校验
        # 逐条把索引里的 source.commit 拉到临时仓库里 checkout 一次，
        # 确认市场安装真的能装上（发布通道换过导致 hash 失配时会在此拦下）。
        run: node scripts/verify-market.mjs
